room_047:
  kind: insert
  caption: >-
    SCENE: A close-up insert of a printed newspaper page. The paper has a grey, grainy texture with faint horizontal lines suggesting newsprint.


    VIEW: Flat, head-on perspective. No visible depth or vanishing points; the surface is parallel to the viewer.


    LAYOUT:

    *   **Headline (0.1–0.75, 0.0–0.3):** Large, bold serif text spanning the upper left and center.

    *   **Byline (0.2–0.4, 0.3):** Small centered text below the headline.

    *   **Left Text Column (0.0–0.1, 0.0–1.0):** Partial column of body text on the far left edge.

    *   **Center Text Column (0.15–0.45, 0.35–1.0):** Dense block of justified body text below the byline.

    *   **Portrait (0.45–0.75, 0.2–0.95):** Rectangular grayscale photograph of an older man's face and shoulders, positioned in the right-center.

    *   **Right Text Columns (0.75–1.0, 0.0–1.0):** Two columns of dense body text on the right side.

    *   **Caption (0.45–0.7, 0.95–1.0):** Small text directly beneath the portrait.


    OBJECTS:

    *   **Portrait:** Shows a balding man with round wire-rimmed glasses, wearing a light-colored shirt and dark tie. He faces forward with a neutral expression.

    *   **Newspaper Grid:** Faint vertical rules separate the text columns.


    LIGHTING: Uniform, flat illumination across the entire surface. There are no distinct highlights or cast shadows, indicating diffuse lighting typical of a document scan or painting.


    PALETTE: Monochromatic. Dominant tones are mid-grey for the paper background, black for all typography and the darkest parts of the portrait, and lighter greys for the highlights on the subject's face and shirt.


    TEXT:

    *   "German Wizard Splits Atom" (Top center)

    *   "by HARRY D. WARD" (byline below the headline)

    *   "Dr. Hans Ubermann" (below the portrait)

    *   Body text is present but illegible due to resolution.


    INVARIANTS:

    *   The specific layout grid: Headline top-left/center, photo right-of-center, three main text columns flanking the central elements.

    *   The portrait must be a grayscale, front-facing headshot of a bespectacled man.

    *   The font style must remain a heavy, condensed serif for the headline and a standard serif for body text.

    *   The overall aspect ratio and cropping must match the provided frame.
