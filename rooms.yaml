room_095:
  kind: scene
  caption: >-
    SCENE: Open sea seen from above: an unbroken field of rippling deep-blue water. No land, boats or sky.


    VIEW: Looking straight down at the water surface. There is no perspective depth; the plane appears to extend infinitely in all directions within the frame.


    LAYOUT:

    *   **Surface (0-1 horizontal, 0-1 vertical):** A continuous field covering the entire canvas. Small pale-blue ripple highlights are scattered across medium-blue water. The distribution of these marks is random but evenly spaced. There are no foreground, middle ground, or background layers.


    OBJECTS: None. No doors, windows, furniture, or props are present.


    LIGHTING: Flat and even. There are no cast shadows, highlights, or gradients indicating a specific light source direction. The exposure is consistent throughout the image.


    PALETTE: Monochromatic blue scheme. The base color is a solid, medium azure blue. The texture elements are a slightly lighter, pale blue or cyan.


    TEXT: None.


    INVARIANTS: The composition is defined entirely by the texture. The repainting must maintain the density, size and orientation of the small pale ripple highlights relative to the medium-blue background. The pattern must remain uniform without clustering or gaps. The boundary between the two shades should be soft, consistent with the low-resolution origin of the reference material.
