room_085:
  kind: insert
  caption: >-
    SCENE: A close-up insert of a massive, curved stone or metal architectural element against a solid black void. The surface is covered in dense, maze-like geometric engravings.


    VIEW: Extreme close-up, angled to show the curve of the object sweeping from the lower left toward the upper right.


    LAYOUT:

    *   **Curved Band (Foreground/Middle):** Occupies roughly 60% of the frame, arcing from x=0.25, y=1.0 up to x=1.0, y=0.0. It has a thick, rounded outer edge and a flat inner face.

    *   **Engraved Pattern:** Covers the entire flat face of the band. Consists of interconnected rectangular and L-shaped grooves forming a complex labyrinthine pattern.

    *   **Small Protrusion:** Located at x=0.22, y=0.6. A small, blocky structure juts out from the left side of the main band. It contains a tiny, distinct blue pixel or highlight on its top-left corner.

    *   **Background:** Pure black, occupying the negative space around the curve.


    OBJECTS:

    *   **Main Structure:** A single, continuous curved slab or wall segment. No doors, windows, or separate furniture are visible.

    *   **Protrusion:** A small, undefined mechanical or architectural attachment on the left flank.


    LIGHTING: Flat, diffuse illumination typical of 2D game assets. No strong directional shadows; depth is conveyed through the dark outlines of the engraved grooves and the slightly lighter tone of the raised surfaces.


    PALETTE:

    *   **Structure:** Muted olive-grey / sage green base tone.

    *   **Engravings/Outlines:** Dark charcoal or near-black.

    *   **Highlight:** Single bright blue pixel on the protrusion.

    *   **Background:** Absolute black.


    TEXT: None.


    INVARIANTS:

    *   The specific curvature of the main band must be preserved.

    *   The intricate, non-repeating geometric pattern of the engravings must match the original layout exactly.

    *   The position and shape of the small protrusion with the blue detail on the left must remain identical.

    *   The contrast between the muted grey-green surface and the black background/grooves is essential to the legibility of the pattern.
