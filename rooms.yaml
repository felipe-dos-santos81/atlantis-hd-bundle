room_029:
  kind: scene
  caption: >-
    SCENE: Exterior daytime Middle Eastern market square. Flat-roofed mud-brick and plaster buildings, crenellated parapets, minarets with gold finials, arched doorways, and a dirt plaza.


    VIEW: Eye-level, wide panoramic perspective looking across the open square toward the building line; slight downward tilt showing the ground plane.


    LAYOUT:

    *   Foreground (0.0-1.0): Dirt ground surface. Bottom-left corner (x~0.05, y~0.9) features a blue tent roof edge. Bottom-right corner (x~0.9, y~0.85) shows the angled wooden top of a market stall.

    *   Mid-ground Left (x~0.0-0.4): A cluster of stalls. Far left (x~0.05) is a stack of clay pots next to a red awning. Center-left (x~0.2) is a large flower stall with a striped canopy, filled with yellow, orange, and purple blooms in baskets. Behind this (x~0.35) stands a tall, square brick tower with vertical slit windows and a white base.

    *   Mid-ground Right (x~0.45-1.0): A continuous row of shops. At x~0.5 is a stone tower with a blue-trimmed, red-slatted gate. Adjacent (x~0.6) are storefronts with red-and-white striped awnings and dark green tiled walls. Further right (x~0.75) is an archway leading into a shaded alley. At x~0.85 stands a small, standalone blue kiosk with a red pyramidal roof. Far right (x~0.95) features a large, pale pink building with a pointed horseshoe arch entrance.

    *   Background (0.0-1.0): Distant hazy mountains visible above the rooftops on the left and center.


    OBJECTS:

    *   **Flower Stall:** Large structure at x~0.2, featuring a beige/white striped canvas roof supported by wooden posts. The interior is dark, but the front is densely packed with potted flowers.

    *   **Brick Tower:** Tall, unadorned tan brick structure at x~0.35 with narrow vertical window slits.

    *   **Stone Gatehouse:** Two-story stone structure at x~0.5 with a prominent blue horseshoe arch framing a red wooden gate with vertical bars.

    *   **Shopfronts:** Buildings at x~0.6-0.7 have red-and-white striped awnings. Goods (rugs, pottery) are piled on the ground in front.

    *   **Blue Kiosk:** Small rectangular booth at x~0.85 with vertical blue paneling and a red roof.

    *   **Archways:** Multiple entrances: a dark arch at x~0.75 and a large, light-colored arch at x~0.95.

    *   **Minarets:** Two slender towers topped with gold domes/finials are visible in the background skyline (one at x~0.3, one at x~0.8).


    LIGHTING: Bright, direct overhead sunlight. Shadows are cast sharply to the right and slightly forward from objects (e.g., under the flower stall canopy, behind the kiosk). The scene is evenly exposed with high contrast between sunlit facades and deep shadows within archways.


    PALETTE: Dominant earth tones—tan, ochre, beige, and terracotta for the architecture. Accents include the bright blue of the tent and kiosk, the red of awnings and gates, the gold of the minaret tops, and the varied yellows/purples of the flowers. The sky is a pale, washed-out blue.


    TEXT: None.


    INVARIANTS: The specific arrangement of the flower stall in front of the brick tower, the sequence of the stone gatehouse followed by the striped-awning shops, and the isolation of the blue kiosk near the far-right archway must be maintained. The relative heights of the foreground tents/stalls versus the mid-ground buildings define the depth.
