    - **Right (0.75–1.0):** A vertical stack of striped bowls sits next to large, light-colored ceramic urns. Above these, a framed textile or rug hangs on the wall, next to a rectangular sign with script.

    - **Top:** Laundry (white garments) hangs from lines strung across the upper section of the frame.


    OBJECTS:

    - **Signage:** A main banner reading "ARTIFACTS" and a smaller tag below reading "SOUVENIRS." A separate sign on the far right features non-Latin script.

    - **Merchandise:** Dozens of clay pots, vases, and bowls in varying shapes and sizes are scattered across the foreground floor and arranged on shelves.

    - **Decorations:** A red garment hangs on the left; a patterned tapestry hangs on the right; a carved mask is visible in the central shadows.

    - **Architecture:** A simple window with a cross-pane design is visible in the upper right background.


    LIGHTING: Bright, direct sunlight hits the scene from the upper left, casting hard shadows to the right of the objects. The interior of the stall is significantly darker than the exterior goods.


    PALETTE: Dominated by warm earth tones—terracotta oranges, browns, and tans. Accents include the bright red of the cloth and text, the stark white of the banner and laundry, and muted blues/purples in the background fabrics.


    TEXT:

    - "ARTIFACTS" (center-left, on white banner)

    - "SOUVENIRS" (center-left, on small tag)

    - Unreadable script on the right-hand sign.


    INVARIANTS: The specific arrangement of the "ARTIFACTS" banner over the dark entrance, the position of the shelving unit to the right of the entrance, and the dense layering of pottery in the immediate foreground must be maintained. No people are present in this background image.
room_065:
  kind: scene
  caption: >-
    SCENE: Interior of a multi-room stone building, possibly a dwelling or outpost. The atmosphere is rustic and slightly cluttered. The architecture features prominent rounded arches supported by thick, cylindrical columns.


    VIEW: Eye-level, straight-on perspective looking through three large arched openings into an adjoining space. The framing is defined by the dark stone of the foreground arches.


    LAYOUT:

    *   **Foreground:** A continuous row of objects sits at the bottom edge (y=0.85-1.0). From left to right: red fabric, wooden crate, green coiled rope, brown sack, large dark pot, small red jug, patterned rug on the floor, terracotta amphora, stone statue head, pile of cloth/bones, stacked bowls, wooden barrel, and metal pots.

    *   **Middle Ground:** Three main sections separated by columns.
        *   Left (x=0.05-0.3): A wooden table with a white box and small figures. Behind it, a grey cabinet and a bed with red covers. Clothes hang from a line above.
        *   Center (x=0.35-0.65): An open area with a low wall or bench. A blue and white patterned cloth lies on the floor. A small table holds a green bowl and a red jar. A window looks out to a bright exterior.
        *   Right (x=0.7-0.95): A doorway leading to another room. A wooden barrel sits on the floor. A string of red beads hangs vertically.
    *   **Background:** Visible through the center window, showing a sunlit outdoor scene with buildings and blue sky.


    OBJECTS:

    *   Doors: One closed wooden door in the far right background (x=0.9, y=0.6).

    *   Windows: One open window in the center background (x=0.45, y=0.45) revealing the outside.

    *   Furniture: Table (left), cabinet (left), bed (left), small side table (center).

    *   Props: Hanging laundry (white and red garments), barrels, pots, jars, ropes, rugs, statues.


    LIGHTING: Primary light source is natural daylight entering from the center window and the right-side doorway. This creates bright highlights on the central floor and the right wall. The foreground and the spaces immediately behind the arches are in deep shadow. Shadows fall generally towards the viewer and to the left.


    PALETTE: Dominant earth tones—browns, tans, and greys for the stone and wood. Accents of muted red (clothes, jars, rug), green (rope, bowl), and blue (sky, cloth). The overall image has a desaturated, dusty quality.


    TEXT: none


    INVARIANTS: The three-point arch structure defines the composition. The vertical alignment of the columns is critical. The layering of foreground clutter, middle-ground living space, and background view must be maintained. The specific placement of key items like the hanging clothes, the central window, and the right-hand door anchors the scene's identity.
room_066:
  kind: scene
  caption: >-
    SCENE: An exterior underwater landscape, resembling a sunken ancient ruin. The atmosphere is dim and deep-sea.


    VIEW: A wide continuous panoramic view. The perspective is at ground level on the sandy seabed, looking slightly upward toward distant hills.


    LAYOUT:

    *   **Left (0.0–0.2):** Foreground features large grey stone ruins with dark rectangular openings, partially covered in red coral and green seaweed. Behind this, a dark blue mountain range spans the horizon.

    *   **Center-Left (0.1–0.3):** A small white oval object (~0.15) lies flat on the sand. The background remains the dark blue mountains.

    *   **Center (0.3–0.46):** A prominent grey trapezoidal stone block sits on a mound of pale sand. It bears a carved geometric symbol. Tall green sea plants grow from its right side.

    *   **Center-Right (0.6–0.8):** The foreground contains scattered debris, rocks, and reddish-brown vegetation. The middle ground shows a sloping ridge of light grey rock or sand leading to the right.

    *   **Right (0.8–1.0):** The terrain rises into a rocky hill featuring several dark, square-like openings or caves. Green vegetation dots the rocky surface.


    OBJECTS: Stone ruins with dark rectangular windows/openings (left); a white oval object (center-left); a large grey stone block with a carved spiral-and-line symbol (center); a cluster of tall green aquatic plants (center-right of the block); a small low pyramid-shaped rock (center-right); various scattered rocks and debris; a rocky hill with multiple cave openings (right). No doors are visible.


    LIGHTING: Ambient underwater light, appearing to filter down from above. The water gradient shifts from bright cyan-blue at the top to deep navy/black at the horizon line. Shadows are soft and diffuse, cast primarily by the stone structures onto the sand.


    PALETTE: Dominant blues ranging from bright cyan (top) to dark navy (horizon). Pale beige/white for the sand. Grey tones for the stone ruins and central block. Accents of muted green (plants), dull red/brown (coral/debris), and black (openings).


    TEXT: None.


    INVARIANTS: The continuous transition from open sandy foreground to rocky background. The specific placement of the central stone block relative to the surrounding mounds. The consistent horizon line formed by the dark blue mountains across all segments. The distribution of vegetation (concentrated near the left ruins and the central block). The presence of the white oval object on the sand.
room_067:
  kind: scene
  caption: >-
    SCENE: Exterior desert excavation site under a clear sky. The environment features rugged, stratified rock formations in the background and flat, sandy ground in the foreground. It is a working camp with dug-out trenches and mining equipment.


    VIEW: Wide-angle horizontal panorama. The camera is positioned at a slightly elevated eye level, looking across the terrain. It is a single continuous scrolling panorama; the windows below are just its left, centre and right thirds.


    LAYOUT:

    *   **Left Window:** A large rocky outcrop dominates the upper left. Below it are white canvas tents. In the mid-ground, there is a deep rectangular trench cut into the sand, containing wooden planks and a ladder. A wooden barrel sits near the trench edge.

    *   **Center Window:** Continues the trench line. A tall wooden derrick or crane structure stands on the far side of the trench. More tents are visible behind the derrick. A small mound of excavated earth is in the center.

    *   **Right Window:** A military-style truck is parked in the lower-right foreground, angled toward the viewer. Behind it, the landscape opens up to a flat plain with distant mesas. A pile of dirt sits to the right of the truck.


    OBJECTS:

    *   **Tents:** Several white canvas structures, some appearing as standard issue military tents, others as low shelters. They are clustered in the background left and center.

    *   **Mining Equipment:** A prominent wooden derrick/crane stands in the center. To its right, a smaller mechanical winch or pump handle is visible. Wooden planks and beams lie scattered near the trench.

    *   **Vehicles:** One olive-drab utility truck with a slatted cargo bed is parked in the right window. It faces slightly left.

    *   **Debris:** A single wooden barrel is located in the left/center transition area. Loose rocks and mounds of sand are distributed throughout the foreground.


    LIGHTING: Bright, direct sunlight coming from the upper right. Shadows are cast to the left of objects (e.g., the truck's shadow falls to its left, the derrick casts a long shadow to the left). The lighting is harsh, typical of midday desert conditions.


    PALETTE: Dominant tones are sandy beige, tan, and light brown for the ground and rocks. The sky is a gradient of pale blue to lavender. The truck is olive green/brown. Tents are off-white/light grey. Shadows are dark brown/purple.


    TEXT: The number "26" is painted in white on the door of the truck in the right window. No other legible text is visible.


    INVARIANTS: The relative position of the truck (right foreground) and the derrick (center background) must be maintained. The depth of the trench and the angle of the rock formations on the left are fixed. The horizon line remains consistent across all three panels. The truck's orientation (3/4 view facing left) is a key compositional anchor.
