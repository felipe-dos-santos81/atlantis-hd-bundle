  kind: skip
  caption: ''
room_069:
  kind: scene
  caption: >-
    SCENE: Exterior. A sunlit, arid mountain pass or canyon gap with a flat dirt floor. The atmosphere is bright and open.


    VIEW: Eye-level perspective looking down the length of the valley. The composition uses the steep rock walls on either side as leading lines converging toward the center horizon.


    LAYOUT:

    - Left Foreground (0.0–0.25): A steep, craggy rocky cliff face drops sharply into a dark, rectangular cave opening near the bottom edge.

    - Right Foreground (0.75–1.0): A sloping sandy hill rises from the bottom right corner, featuring scattered dark rocks and a wooden crate resting on the ground at roughly 0.65 horizontal position.

    - Middle Ground: A flat, dusty path runs through the center. On the left side of this path (approx. 0.3), a blue jeep is parked facing slightly away from the viewer.

    - Background (0.4–0.6): The canyon opens up to reveal a distant body of water (sea) meeting the sky at the horizon line.


    OBJECTS:

    - Jeep: Blue body, black tires, visible windshield and roll bar.

    - Wooden Crate: Brown, square, with an X-shaped brace on the front face; contains a white object (possibly paper).

    - Cave Opening: Dark, unlit entrance set into the lower left cliff.

    - Rocks: Numerous grey and brown boulders are scattered across the foreground and embedded in the hillsides.


    LIGHTING: Strong overhead sunlight creates high contrast. Shadows fall directly beneath the jeep and crate, and along the base of the rock formations. The interior of the cave is completely black.


    PALETTE: Dominant tones of sand-tan, ochre, and light brown for the terrain. Cool greys and slate blues for the large rock formations. Bright azure blue for the sky and the jeep. Deep black for shadows and the cave mouth.


    TEXT: None.


    INVARIANTS: The V-shape formed by the left cliff and right hill must remain. The specific placement of the jeep on the left mid-ground and the crate on the right foreground must be preserved. The distant ocean horizon is a fixed background element. No people are present in the background.
room_070:
  kind: insert
  caption: >-
    SCENE: A dense, isometric nighttime city block. The environment consists of a grid of multi-story buildings separated by dark asphalt streets. A river or canal cuts diagonally across the lower-right quadrant, bordered by tree-lined embankments. The atmosphere is quiet and urban, characterized by scattered artificial light against deep shadow.


    VIEW: High-angle isometric perspective (approx. 45 degrees). The camera looks down onto the street level and rooftops simultaneously. The framing captures a wide swath of the city grid, showing multiple intersections and building blocks.


    LAYOUT:

    *   **Background/Upper Half:** A tight grid of rectangular city blocks. Buildings are densely packed, with narrow sidewalks between them.

    *   **Middle Ground:** A prominent intersection sits near the center. To its right, the street layout shifts to accommodate the water feature.

    *   **Foreground/Lower Right:** A blue body of water (canal) flows from the bottom center toward the right edge. It is flanked by green strips of trees on both banks.

    *   **Occlusion:** Taller buildings in the upper-left cast shadows over the adjacent streets. Trees partially obscure the bases of some structures along the canal.


    OBJECTS:

    *   **Buildings:** Numerous grey and purple-hued structures, ranging from low-rise shops to mid-rise apartments. Most have flat or slightly pitched roofs. Windows are visible as small yellow squares.

    *   **Vegetation:** Clusters of green trees appear in small parks (top left), along the canal banks, and in medians.

    *   **Street Furniture:** Streetlamps line the sidewalks, emitting bright white/yellow glows. A few cars are parked or driving on the streets (visible as small colored rectangles).

    *   **Water:** The canal has a solid blue surface with no visible waves or reflections other than the ambient color.


    LIGHTING: Nighttime setting. The primary light sources are the glowing windows of the buildings (yellow) and the streetlamps (white/pale yellow). These create pools of light on the dark grey pavement. The overall scene is dimly lit, with strong contrast between the illuminated areas and the unlit shadows of the buildings.


    PALETTE: Dominant colors are dark slate blue/grey for the streets and night sky, muted purples and greys for building facades, bright yellow for window lights, vibrant green for foliage, and medium blue for the water.


    TEXT: None.


    INVARIANTS: The isometric angle must be maintained. The specific arrangement of building blocks relative to the central intersection is fixed. The diagonal path of the canal in the lower right is a key structural element. The placement of streetlamps along the curbs is consistent. No people are painted into the background; any characters will be overlaid sprites.
room_071:
  kind: scene
  caption: >-
    SCENE: Exterior at night: the outer (convex) corner of a brick building projecting toward the viewer, with a sidewalk band and a street in front. The atmosphere is dim and cool.


    VIEW: Eye-level perspective looking directly at the vertical corner where two walls meet. The framing captures the upper portion of the walls, a horizontal baseboard or ledge, and the floor extending towards the viewer.


    LAYOUT:

    *   **Background (0-1 width, 0-0.4 height):** Two brick walls meeting at a central vertical seam. The left wall occupies x=0 to ~0.5; the right wall occupies ~0.5 to x=1. Both are constructed of dark, rectangular bricks in a running bond pattern.

    *   **Middle (0-1 width, 0.35-0.65 height):** A continuous, lighter-toned horizontal band or ledge runs across both walls, dipping slightly at the central corner point. It separates the brickwork above from the surface below.

    *   **Foreground (0-1 width, 0.6-1 height):** A flat, textured floor surface, likely stone or concrete, stretching from the base of the ledge to the bottom edge of the frame. The floor meets the ledge along a distinct horizontal line that angles down toward the center.


    OBJECTS: No doors, windows, furniture, or props are visible. Only architectural surfaces (walls, ledge, floor) are present.


    LIGHTING: Diffuse, ambient light with no distinct directional source. The scene is uniformly underexposed, creating a murky, low-contrast environment. Shadows are soft and indistinct, primarily defined by the texture of the bricks and the projecting corner edge.


    PALETTE: Dominated by desaturated, cool tones.

    *   Bricks: Dark slate blue/grey.

    *   Ledge/Baseboard: Muted teal-grey.

    *   Floor: Deep purple-grey with subtle textural variations.


    TEXT: None.


    INVARIANTS:

    *   The precise 90-degree angle of the corner must remain centered horizontally.

    *   The horizontal alignment of the ledge/baseboard across both walls, including its slight downward dip at the corner.

    *   The scale and pattern of the brickwork on both walls.

    *   The clear separation between the three horizontal zones: brick wall, ledge, and floor.

    *   The uniform, low-key lighting level.
room_072:
  kind: scene
  caption: >-
    SCENE: A dark, cavernous interior carved into rough rock. The architecture consists of two man-made stone structures set against a natural, jagged cliff face. The atmosphere is enclosed and ancient, with deep shadows suggesting a subterranean or cave environment.


    VIEW: A straight-on, eye-level perspective showing the room's width. The camera is static, capturing the full breadth of the space from the left wall to the right exit.


    LAYOUT:

    *   **Left (0-0.3):** A large, rectangular stone doorway frame occupies the mid-ground. Inside is a solid red door featuring a central circular emblem. To the right of this door, on the stone pillar, are two small, stacked square panels.

    *   **Center (0.3-0.7):** A chaotic pile of rubble and loose rocks fills the floor space between the two main structures. Behind the rubble stands a smaller, secondary stone structure with a dark, rectangular opening at its base. Above this opening is a lintel carved with a bull's head.

    *   **Right (0.7-1.0):** A steep stone staircase ascends toward the upper right corner. At the top of the stairs, a small rectangular window allows light to enter. The surrounding walls are textured with vertical striations of rock.


    OBJECTS:

    *   **Left Door:** A closed, heavy red door with a metallic or gold-colored border and a central rosette design.

    *   **Stone Pillar:** Flanks the red door; features two distinct square relief carvings arranged vertically.

    *   **Central Niche:** A recessed alcove in the middle background with a black void inside. It is topped by a carved stone header.

    *   **Staircase:** A flight of stone steps leading upward on the far right side.

    *   **Window:** A small, high-set opening near the top right, emitting bright blue light.

    *   **Rubble:** Scattered grey stones and debris cover the floor throughout the scene.


    LIGHTING: The primary light source is the small window on the upper right, casting a cool blue glow onto the top of the staircase. This light fades quickly into the darkness of the room. The rest of the scene is dimly lit, likely by ambient reflection, leaving the center and left areas in shadow. The red door appears slightly illuminated but remains muted.


    PALETTE: Dominant tones are desaturated greys, browns, and blacks for the rock and stone. The red door provides the only significant warm color accent. The window introduces a patch of pale blue.


    TEXT: none


    INVARIANTS: The relative height of the red door compared to the central niche must remain consistent. The position of the two square panels on the left pillar is fixed. The angle of the staircase and the specific shape of the rubble pile in the center define the floor plan. The window must remain in the upper right quadrant. No people are present.
room_073:
  kind: scene
  caption: >-
    SCENE: A dim, cavernous interior—likely a cave or temple entrance—partially open to an exterior canyon. The atmosphere is dusty and shadowed, with rough-hewn stone walls and a low wooden ceiling supported by beams.


    VIEW: Eye-level, wide-angle view looking straight into the room. The composition is symmetrical around a central opening that frames the outside world.


    LAYOUT:

    - Left (0.0–0.35): A large, dark mural depicts two robed figures facing each other and reaching toward each other; below them is an inscribed panel. In front of this area sits a grey generator on wheels, connected by cables.

    - Center (0.35–0.65): A set of curved, rib-like structures (possibly bones or architectural ribs) arches over a narrow path leading to the exit. Beyond the threshold, a ladder leans against a distant wall under a blue sky. A narrow-gauge mine-cart track runs down the center toward the opening, with a small mine cart on it near the doorway and a cable hanging above it.

    - Right (0.65–1.0): A simple wooden table holds a single orange bird. Behind it, a stone slab leans against the wall next to another dark panel covered in faint markings. The far right shows more craggy rock face.


    OBJECTS:

    - Central doorway/opening: Open, revealing exterior terrain.

    - Ladder: Leaning vertically inside the outer space, visible through the door.

    - Generator: On casters, positioned left-center foreground.

    - Table: Four-legged, wood, holding one bird; located right-middle ground.

    - Stone slab: Leaning upright behind the table.

    - Mural/panels: Three distinct vertical surfaces—left mural, center-right carved panel, rightmost textured wall—all appear static and non-interactive in form.

    - No doors are present except the main opening; no windows.


    LIGHTING: Two hanging lanterns emit warm yellow light from above—one centered over the path, one slightly right of center. Light falls downward, casting soft shadows beneath objects. Exterior daylight illuminates the canyon beyond, creating contrast with the interior gloom. Overall exposure is low-key; most areas remain in deep shadow.


    PALETTE: Dominant tones are muted browns, ochres, and greys for stone and earth. Accents include pale blue sky outside, warm yellow from lamps, and the bright orange of the bird. Murals use darker reds and blacks.


    TEXT: None legible. Faint symbols or script appear on the right-hand panels but are not decipherable as words.


    INVARIANTS:

    - Symmetry broken only by placement of generator (left) and table/bird (right).

    - Central axis defined by doorway, ladder, and hanging lamp directly above it.

    - Ribbed structure spans across mid-ground, partially obscuring view into depth.

    - All elements must retain relative scale and occlusion: e.g., generator blocks lower-left portion of mural; table hides base of leaning slab.

    - Ambiguity noted: exact nature of “rib” structures unclear—could be bone, metal, or carved stone; preserve their curvature and spacing without specifying material.
room_074:
  kind: scene
  caption: >-
    SCENE: Interior close-up insert of a tabletop. The atmosphere is warm and enclosed, defined by wood surfaces and an antique object held in hand.


    VIEW: High-angle, looking down at approximately 45 degrees onto the table surface. The framing is tight, focusing on the central action of the hand holding the artifact.


    LAYOUT:

    *   **Left (0.0 - 0.2):** A large, shallow ceramic bowl or pot with greenish-yellow bands sits in the upper-left corner. Below it is a flat, light grey-blue surface (possibly a map or paper) extending to the bottom left.

    *   **Center (0.3 - 0.7):** A human right hand enters from the bottom right, gripping a bronze-colored vessel. The vessel has a flared base, a tapered body with horizontal ridges, and a complex top featuring curved, horn-like protrusions. The hand occupies the middle-right foreground.

    *   **Right (0.8 - 1.0):** A purple cylindrical cup or vase sits in the upper right, containing two vertical wooden sticks or rods.

    *   **Background:** The entire background is a dark reddish-brown wooden table surface with visible grain. A dark green rectangular area is visible beneath the hand/wrist in the lower center.


    OBJECTS:

    *   **Vessel:** Bronze/brass color. Open top (interior visible). Features decorative ridges and curved handles/horns near the rim.

    *   **Hand:** Right hand, fair skin tone, holding the vessel securely. Thumb rests on the side; fingers wrap around the base. A blue shirt cuff is visible at the wrist.

    *   **Bowl (Top Left):** Ceramic, beige/tan with green stripes. Partially cropped.

    *   **Cup (Top Right):** Purple/maroon. Contains two tan wooden sticks.

    *   **Surface (Bottom Left):** Flat, light grey/blue sheet.


    LIGHTING: Warm, ambient light coming from above and slightly left. Soft shadows are cast by the hand and vessel onto the table and the grey surface below. The interior of the vessel is dark.


    PALETTE: Dominant earth tones. Reddish-brown wood, bronze/copper for the vessel, fair skin tones, purple accent (cup), muted green (bowl stripes, floor mat), light grey-blue (paper/surface).


    TEXT: None.


    INVARIANTS: The hand must hold the vessel in the same orientation (tilted slightly towards the viewer). The relative positions of the bowl (top left) and cup (top right) must remain fixed. The lighting direction and shadow fall-off must match. The specific shape of the vessel's "horns" and ridges is critical. No people other than the single hand/arm are present.
room_075:
  kind: insert
  caption: >-
    SCENE: A hand-drawn world map, flat top-down cartographic view. The strip is four separate maps at increasing zoom placed side by side with hard seams: New York State, the North Atlantic, the Mediterranean, and a close-up of Aegean islands above the north coast of Crete. The atmosphere is that of an aged paper chart with no horizon or sky.


    VIEW: Directly overhead, orthographic, no perspective convergence. The image is four independent map panels; the seams at 0.25, 0.5 and 0.75 are hard cuts, not continuous geography.


    LAYOUT: Panel 1 (0–0.25): New York State in tan, Lake Ontario upper-left, the Finger Lakes left-centre, the Hudson River, thin state borders, a red-and-black marker labelled "BARNETT COLLEGE" at centre, and a second marker labelled "NEW YORK CITY" at the coast by Long Island; compass rose bottom-left. Panel 2 (0.25–0.5): the North Atlantic, with eastern North America and the Caribbean left, the top of South America bottom-left, Greenland and Iceland top, the Azores as tiny mid-ocean islands, the British Isles, Europe and North Africa right; compass rose bottom-left. Panel 3 (0.5–0.75): the Mediterranean, with Spain left, France and Italy top, Corsica, Sardinia, Sicily, Greece and the Aegean islands, Turkey, the Black Sea top-right, Cyprus, and North Africa below with borders; compass rose bottom-left. Panel 4 (0.75–1): open Aegean sea with scattered small islands along the top, including a crescent-shaped one, and the long north coast of Crete along the bottom edge; compass rose top-left. No occlusion; all elements lie on one plane.


    OBJECTS: No doors, windows, furniture or props. Cartographic features only: coastlines, internal border lines (thin brown), lakes, rivers, islands, two red-and-black crosshair location markers (panel 1 only), and four eight-pointed compass roses (one per panel) (tan disc, black spokes, red cardinal points).


    LIGHTING: Flat, even illumination; no cast shadows, no highlights, no dark areas. Exposure is uniform across land and sea.


    PALETTE: Land is warm tan/peach with faint greenish mottling and darker brown contour shading. Coasts carry a thin dark-brown outline ringed by a lighter cyan shallow-water halo. Open water is a flat medium turquoise-blue. Markers are red with black centres. Compass roses are pale gold with black and red.


    TEXT: "BARNETT COLLEGE" (panel 1 centre, just above and right of its marker). "NEW YORK CITY" (panel 1 lower right, just below and right of its coastal marker). Both in a small pixelated serif, dark brown. No other legible lettering.


    INVARIANTS: Preserve the exact positions and shapes of every coastline, the relative placement of the two named markers and their labels, the number and locations of the four compass roses, the internal border lines, and the consistent coast-outline-plus-shallow-halo treatment. Keep the four panels as separate maps with hard seams at 0.25, 0.5 and 0.75; do not blend geography across the seams. Ambiguity: precise national borders are stylised and not geographically accurate—repaint them as drawn, not as real geography. No people are present.
room_076:
  kind: scene
  caption: >-
    SCENE: Exterior jungle overlook. A grassy plateau meets a steep drop-off, with a distant mountain range and hazy valley below. On the far right is a stepped stone pyramid ruin partially overgrown with vines. The atmosphere is bright, humid, and tropical.


    VIEW: Eye-level perspective looking across the plateau toward the drop-off and pyramid. Wide horizontal framing.


    LAYOUT:

    - **Left (0.0–0.3):** A dirt track curves from the upper left across a grassy clearing. A grey-green jeep facing the viewer sits on the track at x≈0.08, y≈0.75. Behind the road rises a steep, rocky green hillside.

    - **Center-Left (0.2–0.5):** Dense foreground foliage dominates. Several large tree trunks rise vertically; one prominent trunk stands at x≈0.4, y≈0.8. Branches and leaves arch overhead, creating a canopy that frames the view.

    - **Center (0.5–0.65):** A gap in the trees reveals the background: a deep ravine or valley with misty blue-grey mountains in the distance. A single hanging vine drops vertically at x≈0.55.

    - **Right (0.65–1.0):** An open grassy area. A curved, light-barked tree stands at x≈0.75, y≈0.6. To its right, a low stone wall runs horizontally at x≈0.85, y≈0.7. Further right is the base of the pyramid structure. In the immediate right foreground (x≈0.9, y≈0.8), a wooden kiosk stands on the grass.


    OBJECTS:

    - **Jeep:** Parked on the dirt track, facing the viewer.

    - **Kiosk:** Wooden structure with a flat roof and hanging items. Located in the right foreground.

    - **Pyramid:** Stepped stone ziggurat in the right background, covered in patches of green vegetation.

    - **Stone Wall:** Low retaining wall in front of the pyramid base.

    - **Trees:** Multiple species including broadleaf jungle trees and palm-like fronds on the left.


    LIGHTING: Bright daylight from above. Shadows fall directly beneath objects (jeep, kiosk, trees). The interior of the tree canopy is significantly darker than the open sky and sunlit grass.


    PALETTE:

    - **Foliage:** Various shades of vibrant green, dark forest green for shadows, and yellow-green for highlights.

    - **Sky:** Pale blue with soft white clouds.

    - **Background Mountains:** Hazy blue-grey.

    - **Ground:** Bright lime green grass; tan dirt track.

    - **Architecture:** Tan and brown stone for the pyramid; reddish-brown wood for the kiosk.


    TEXT: "Trinkets" appears in white serif font on the upper signboard of the wooden kiosk in the right foreground.


    INVARIANTS:

    - The jeep must remain on the left road.

    - The kiosk must be in the right foreground, clearly readable.

    - The pyramid must be visible in the right background behind the stone wall.

    - The central gap in the trees must reveal the distant valley/mountains.

