room_052:
  kind: scene
  caption: >-
    SCENE: Interior of a ruined stone structure or cavern. The space is dim, enclosed by rough-hewn walls and rubble. Atmosphere is dark and desolate.


    VIEW: Eye-level perspective, looking slightly down at the floor. Framing captures a wide section of the room, including two distinct vertical structural elements dividing the view.


    LAYOUT:

    - Left third (0 to 0.35): The skeleton of an explorer, painted into the scene, lies on the floor, with a dark red stain beside it and a staff across the floor. Behind the figure, a large pile of broken stone debris rises to mid-height.

    - Center (0.35 to 0.65): A vertical stone pillar stands in the foreground, obscuring the middle ground. Behind it, the floor continues into a recessed area filled with more rubble.

    - Right third (0.65 to 1.0): Another vertical stone pillar stands near the right edge. To its right, a sheet of teal water pours down through a stone doorway from the top of the frame and splashes onto the floor. The surrounding wall is textured stone.


    OBJECTS:

    - Skeleton: a dead explorer lying on the floor in a white pith helmet, tan shirt and brown trousers, part of the painted background.

    - Red Stain: a dark red stain beside the skeleton.

    - Rubble: Large piles of grey, jagged stones in the left and center backgrounds.

    - Pillars: Two thick, vertical stone columns divide the scene horizontally.

    - Waterfall: a vertical sheet of teal water in a doorway on the right.


    LIGHTING: Very low ambient light. The waterfall on the right is the brightest element; its teal catches faint light against the dark stone. The rest of the scene is in deep shadow, with faint highlights on the tops of the rubble and pillars.


    PALETTE: Dominant tones are dark greys and browns for the stone and shadows. Accents include the teal of the waterfall, the dark red of the stain, and the white/tan of the skeleton's helmet and clothing.


    TEXT: None.


    INVARIANTS: The horizontal division created by the two vertical pillars must remain. The skeleton's position relative to the left rubble pile and the red stain must be preserved. The vertical alignment of the waterfall on the right is critical. The depth layering—foreground pillars, mid-ground rubble, background walls—must be maintained.
