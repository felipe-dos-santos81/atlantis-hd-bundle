room_001:
  kind: scene
  caption: >-
    SCENE: Interior of a cluttered, dilapidated workshop or storage room. The atmosphere is dusty and abandoned, with peeling green wallpaper and exposed wooden ceiling beams.


    VIEW: Eye-level side profile view. Standard 2D adventure game perspective looking straight across the room from left to right.


    LAYOUT:

    Left (0-0.3): A tall, dark wooden shelving unit filled with miscellaneous objects sits against the wall. Next to it are two tall, arched windows with bright light streaming in. Below the windows is a workbench with small jars and tools.

    Center (0.3-0.6): A black cast-iron pot-bellied stove stands near the window line, its flue pipe rising to the ceiling ductwork. To its right is a closed wooden door with a glass panel. At the center a desk holds a small dark statuette.

    Right (0.6-1.0): Two lighter-colored wooden shelving units stand side-by-side. The left one has a ladder leaning against its front face. The shelves contain boxes and various items. Further right is another cabinet structure and a broom leaning against the far wall.

    Foreground (Bottom 0.7-1.0): A deep-shadow foreground: the dark silhouettes of a desk, a chair, and a large round wooden tub.


    OBJECTS:

    *   Shelving units: Three main structures (one dark left, two light right).

    *   Windows: Two arched windows, open or clear, showing green foliage outside.

    *   Door: One central wooden door, closed.

    *   Furniture: Workbench under windows, crates in foreground.

    *   Props: Pot-bellied stove with flue pipe, statuette on the desk, ladder, hanging lamps, a white enamel appliance on the right-hand table, round tub in the foreground.


    LIGHTING:

    Primary light sources are the three hanging pendant lamps (conical shades) casting warm yellow pools of light downwards. Secondary light comes from the windows on the left, which are very bright (blown out white/green). The foreground bottom area is in deep shadow. Shadows fall directly beneath objects and hangings.


    PALETTE:

    *   Walls: Muted sage green, heavily textured/peeling.

    *   Woodwork: Ranges from dark brown (left shelf, floor) to medium tan (right shelves, door).

    *   Ceiling: Dark brown beams, grey ductwork.

    *   Accents: Bright white/green (windows), black iron (stove), metallic grey (lamps), rust orange/brown (debris).


    TEXT: none


    INVARIANTS:

    *   The vertical alignment of the windows relative to the left shelf.

    *   The position of the stove between the windows and the door.

    *   The ladder leaning specifically against the middle-right shelf unit.

    *   The horizontal division between the lit floor and the dark foreground silhouettes.

    *   The specific placement of the three hanging lamps across the upper third of the image.

    *   No people.
room_002:
  kind: scene
  caption: >-
    SCENE: An interior school hallway or entrance hall, daytime. A long, low-ceilinged corridor with a blue carpet runs the length of the room. The left side is enclosed by wood panelling and an alcove; the right wall is exposed red brick punctuated by large multi-paned windows looking out onto a sunlit campus.


    VIEW: Eye-level, straight-on perspective. The camera looks horizontally across the room, showing the floor plane receding slightly to the left.


    LAYOUT:

    *   **Left (0.0–0.15):** A dark wooden doorway frame on the far left edge. Beyond it, a glimpse into a blue-walled room containing a small four-pane window.

    *   **Middle-Left (0.15–0.45):** A recessed alcove area. A wooden staircase with balusters ascends from the hallway floor up to the left. A dark brown back wall sits behind the stairs.

    *   **Center (0.45–0.65):** A built-in wooden bench runs along the wall. Above it hangs a grey bulletin board covered in white papers. To the left of the board, a white porcelain drinking fountain is mounted on the wall above the bench.

    *   **Right (0.65–1.0):** A thick red brick pillar separates the interior from the window wall. Large glass windows with dark brown frames dominate this section. A bright patch of sunlight falls on the blue carpet here. A small handrail is visible at the bottom right corner.


    OBJECTS:

    *   **Stairs:** Wooden, ascending to the left, partially obscured by the alcove structure.

    *   **Bulletin Board:** Rectangular, grey background, pinned with multiple illegible white sheets of paper.

    *   **Bench:** Simple wooden slat design, positioned below the bulletin board.

    *   **Drinking Fountain:** White porcelain wall-mounted fountain at the left end of the bench.

    *   **Windows:** Large, divided into upper and lower sashes by horizontal mullions. Vertical mullions divide the width.

    *   **Exterior View:** Through the windows, a red brick building with a clock tower and dome is visible, surrounded by green trees and bushes.


    LIGHTING: Strong natural light enters from the right through the windows, casting a distinct rectangular highlight on the floor. The left side of the room, particularly the stairwell and alcove, is in deep shadow. The exterior view is brightly lit.


    PALETTE:

    *   **Floor:** Deep blue carpet with lighter blue highlights.

    *   **Walls:** Red brick (right), warm brown wood panelling (left/center), pale yellow-green wallpaper (upper center).

    *   **Exterior:** Bright blue sky, vibrant green foliage, terracotta/red brick buildings.

    *   **Shadows:** Dark brown and black tones in the recessed areas.


    TEXT: None legible.


    INVARIANTS: The spatial relationship between the shadowed left wing and the sunlit right wing must be maintained. The bulletin board is centered relative to the bench. The brick pillar acts as a hard vertical divider between the interior architecture and the window wall. The angle of the sunlight on the floor corresponds to the position of the windows. No people are present.
room_003:
  kind: scene
  caption: >-
    SCENE: Interior of a subterranean, industrial bunker. The space is defined by heavy concrete walls and a ceiling cluttered with thick pipes, conduits, and support beams. The atmosphere is oppressive, gritty, and dimly lit.


    VIEW: Eye-level perspective looking slightly downward into the room from behind a foreground barrier. One-point perspective converges toward the back wall.


    LAYOUT:

    Foreground (0.0-1.0 width): The bottom third is a heap of foreground clutter: large, cylindrical metal drums (approx 0.55 and 0.75 width) and rectangular wooden crates or boxes (approx 0.35 width).

    Middle ground: An open floor area leading to the back wall. On the far left (0.0-0.2 width) stands a pot-bellied furnace/stove with a glowing firebox. Left of centre (approx 0.25-0.42 width) is a coal bin heaped with coal, a shovel leaning at its right end and several small yellow boxes in front. In the center (approx 0.55-0.70 width), three tall metal lockers stand side-by-side. To the right (approx 0.85 width), a short flight of stairs ascends to an opening.

    Background: Concrete walls and a complex pipe system overhead.


    OBJECTS: Three closed metal lockers with handles and ventilation slots. A set of stairs with a simple metal handrail on the right. A coal bin heaped with coal and a shovel, left of centre. A pot-bellied furnace with glowing firebox at the far left. Scattered debris, including small crates and barrels, throughout the middle ground.


    LIGHTING: Dim, ambient light with a strong warm, orange-yellow glow emanating from the glowing firebox of the furnace at the far left, casting long shadows to the right. The far right corner and under the ceiling pipes remain in deep shadow.


    PALETTE: Dominant tones are rust-red, dark brown, and muted grey-brown. Accents of bright yellow-orange highlight the left wall, floor, and top edges of objects.


    TEXT: None legible.


    INVARIANTS: The three lockers must remain centered against the back wall. The stairs must ascend on the far right. The foreground heap with its specific arrangement of drums and crates must frame the bottom of the view. The dense network of ceiling pipes must obscure the upper portion of the room. No people are present in the background.
room_004:
  kind: scene
  caption: >-
    SCENE: Interior of a dimly lit, stone-walled room with an arched ceiling. The atmosphere is cold and mysterious, dominated by deep blues.


    VIEW: Eye-level, wide shot showing the entire room from left to right.


    LAYOUT:

    *   **Left (0-0.2):** A dark rectangular pedestal at floor level [0.1, 0.65]. Behind it stands a tall, vertical statue or figure in a niche [0.1, 0.35].

    *   **Middle-Left (0.2-0.4):** A tall carved standing figure [0.25, 0.4] beside a leaning spear and a shelf of small objects [0.34, 0.35].

    *   **Center (0.4-0.5):** An arched window with horizontal slats [0.45, 0.4] letting in bright light. A small object sits on a low ledge below it [0.42, 0.6].

    *   **Foreground:** A large table spans the bottom width [0.0-1.0, 0.7-1.0], cluttered with bowls, a gourd-shaped vase [0.32, 0.8], and a pitcher [0.5, 0.8].

    *   **Right (0.5-1.0):** A large, dark, horned demonic head sculpture [0.6, 0.5] dominates the center-right. To its right is another standing figure [0.78, 0.45] near a brick wall section.


    OBJECTS: Statues, a central demonic mask/head, a table with various vessels (bowls, vases, pitcher), a barred window. No doors are visible.


    LIGHTING: Strong backlight from the central window creates silhouettes for the figures. The foreground table is in deep shadow.


    PALETTE: Monochromatic scheme of varying shades of blue, from black shadows to bright cyan highlights.


    TEXT: None.


    INVARIANTS: The spatial relationship between the statues on the left, the central window, and the large horned head on the right must be preserved. The foreground table acts as a base layer obscuring the lower parts of the background objects.
room_005:
  kind: scene
  caption: >-
    SCENE: Interior of a dim, cavernous or industrial space. A massive ceiling structure composed of angled beams and panels dominates the upper half. The floor is flat stone or concrete, with a foreground ledge holding large, angular blocks.


    VIEW: Low-angle perspective looking slightly upward toward the ceiling. Framing is wide, capturing the full width of the room from left to right.


    LAYOUT:

    - Left (0.0-0.25): Dark vertical wall or pillar. Decorative relief carvings are visible near the top left corner.

    - Center-Left (0.3-0.45): A rectangular block sits on the floor. To its right, a twisted carved statue stands on a pedestal in front of shelving on the back wall.

    - Center (0.45-0.65): A low, box-like object rests on the ground.

    - Right (0.7-0.95): An open rectangular trapdoor in the floor glows with yellow light from below, with a coil of rope beside it. At the far right (0.8-1.0), a tall carved stone sculpture of twisted, intertwined forms stands on the floor.

    - Foreground (Bottom 1/3): A row of large, dark open-topped boxes and crates spans the entire width, obscuring the lower edge of the room.


    OBJECTS:

    - Shelving: Low shelves line the back wall.

    - Open Trapdoor: Right-center floor, lit yellow from below.

    - Carved Sculpture: Far right, tall twisted stone sculpture standing on the floor.

    - Foreground Blocks: Spanning the bottom edge.

    - No doors, windows, or furniture clearly identifiable beyond these elements.


    LIGHTING: Primary light source is the yellow glow on the right floor. Secondary ambient light comes from the upper right, illuminating the ceiling beams and the carved sculpture. Shadows fall heavily on the left side and under the foreground blocks. The overall exposure is low, maintaining a dark atmosphere.


    PALETTE: Dominant deep blues and purples for shadows and mid-tones. Bright yellow-white for the floor glow and highlights on the right-side structure. Darker indigo for the foreground blocks.


    TEXT: none


    INVARIANTS: The low camera angle and upward tilt must be preserved. The relative positions of the glowing floor patch (right), the standing figure (center-left), and the foreground blocks (bottom) are fixed. The diagonal lines of the ceiling beams converge toward the upper center-right.
room_006:
  kind: scene
  caption: >-
    SCENE: Interior library or study. A large, rectangular room with a coffered ceiling, light wood flooring, and built-in bookshelves along the right wall. The atmosphere is quiet and academic, slightly dim in the foreground.


    VIEW: Eye-level perspective looking from the front-left corner toward the back-right. The view encompasses the full width of the room, showing the depth of the floor and the height of the shelving.


    LAYOUT:

    - **Foreground (0-0.3):** Cluttered desk area on the left filled with stacks of books and papers. A dark, low cabinet or counter extends across the bottom center to the right.

    - **Middle Ground (0.3-0.7):** Open wooden floor space. A single wooden chair sits near the center. A small table with a red book is visible on the right side of the open floor.

    - **Background (0.7-1.0):** A wall of tall, wooden bookshelves packed with books. To the left of the shelves, three arched windows look out onto a bright exterior. A plain blue-green wall occupies the far left edge.


    OBJECTS:

    - **Shelving:** Multiple sections of floor-to-ceiling bookcases line the right wall. They are densely packed with books of varying colors and sizes.

    - **Windows:** Three arched, multi-paned windows on the back wall.

    - **Furniture:** One empty wooden chair in the center. A small table with a red book on it. A large, cluttered desk surface in the immediate foreground holding numerous stacked books. A dark cabinet or counter runs along the bottom right.

    - **Ceiling:** A grid of recessed square panels (coffers).


    LIGHTING: Natural light enters through the three back windows, illuminating the rear floor and casting soft shadows forward. The foreground is significantly darker, suggesting interior lighting is off or ambient. Shadows fall to the left of objects.


    PALETTE:

    - **Walls/Floor:** Warm browns and tans for wood; muted teal/blue-green for the far left wall.

    - **Books:** Assorted muted tones—reds, greens, blues, yellows, and browns.

    - **Ceiling:** Greyish-white.

    - **Exterior:** Bright green and pale blue visible through windows.


    TEXT: None.


    INVARIANTS:

    - The three arched windows must be aligned horizontally on the back wall.

    - The bookshelves must occupy the entire right-hand vertical plane.

    - The foreground desk clutter must obscure the lower-left corner.

    - The single chair must remain isolated in the middle of the floor space.

    - The coffered ceiling pattern must span the top of the frame.

    - No people are present.
room_007:
  kind: scene
  caption: >-
    SCENE: Interior, a dimly lit laboratory or storage room with an industrial metal-panel ceiling. The atmosphere is cold and sterile, interrupted by a bright orange-lit doorway on the left.


    VIEW: Eye-level perspective looking slightly upward toward the ceiling panels. Framing includes a large foreground silhouette on the right that crops into the room.


    LAYOUT:

    *   **Foreground:** A large, dark animal head (resembling a cat) occupies the right side (0.62-1.0 horizontal), in profile facing left. Below it, a pile of grey boxes and rubble sits in the lower center (0.3-0.7 horizontal).

    *   **Middle ground:** A low pink table rests at 0.2-0.5 horizontal. Behind it, four pink shelving units line the wall from 0.2 to 0.6 horizontal. To their right, two small statues stand near a window at 0.65-0.75 horizontal.

    *   **Background:** An open doorway reveals a brightly lit orange corridor on the far left (0.05-0.15 horizontal). The rest of the back wall contains the shelving and windows.


    OBJECTS:

    *   **Doorway:** Open on the left, leading to a glowing orange passage.

    *   **Shelving Units:** Four identical pink cabinets with glass-fronted upper shelves and drawers below, filled with indistinct grey and white objects.

    *   **Statues:** A seated grey stone cat statue with a smaller cat beside it (~0.67), and to its right a reclining animal sculpture on a dark pedestal (~0.78).

    *   **Windows:** Two rectangular panes high on the back wall, emitting a pale blue-white light.

    *   **Table:** A simple pink-topped table with thin legs.

    *   **Debris:** Stacked grey crates and blocks in the immediate foreground.


    LIGHTING: Cool, diffuse ambient light dominates the room, casting soft shadows under the furniture. Strong, warm directional light emanates from the orange doorway on the left. Pale cool light spills from the high windows on the right.


    PALETTE: Dominant cool blues and greys for the floor, ceiling, and shadows. Dusty pink/mauve for the furniture. Vibrant orange for the left doorway. Dark teal/black for the foreground animal.


    TEXT: None.


    INVARIANTS: The massive dark silhouette on the right must remain fixed as a foreground occluder. The orange doorway is the only warm light source. The four pink cabinets are evenly spaced along the mid-wall. The ceiling grid recedes sharply toward the back right. No people are visible.
room_008:
  kind: insert
  caption: >-
    SCENE: Close-up insert of an open passport resting on a wooden surface.


    VIEW: High-angle, top-down perspective. The book is positioned diagonally across the frame, with its spine running from the upper-middle-left to the lower-middle-right.


    LAYOUT:

    *   **Wooden Surface (Background):** Fills the entire frame behind the book. Horizontal wood grain texture. Visible at the top edge (0-1, 0-0.2), right edge (0.8-1, 0.2-1), and bottom left corner (0-0.3, 0.75-1).

    *   **Passport Cover:** Dark green binding visible along the left edge (0-0.15, 0-0.8) and extending slightly under the pages.

    *   **Left Page:** Occupies the left half of the image (0-0.5, 0-0.95). Contains printed lines, text fields, and stamps.

    *   **Right Page:** Occupies the right half of the image (0.4-1, 0.1-1). Contains a photograph and text fields.

    *   **Photograph:** A black-and-white portrait of a man located on the right page (0.55-0.8, 0.2-0.6).


    OBJECTS:

    *   **Passport:** Open, lying flat. Green cover, off-white/light green interior pages.

    *   **Portrait:** Black-and-white photo of a man with short, light-colored hair, wearing a dark suit and tie. Looking directly forward.

    *   **Stamps:** Three purple/magenta circular ink stamps are visible. One on the left page (0.05-0.15, 0.45-0.55), one overlapping the bottom-left corner of the photo on the right page (0.45-0.55, 0.45-0.55), and one on the lower right page (0.35-0.45, 0.7-0.8).

    *   **Dotted Circle:** A faint dotted circle outline on the lower left page (0.05-0.15, 0.55-0.65).


    LIGHTING: Flat, even illumination typical of a document scan or close-up shot. No strong directional shadows cast by the book onto the table, though slight shading exists within the crease of the book.


    PALETTE:

    *   **Background:** Medium brown, reddish-brown wood tones.

    *   **Book Cover:** Dark forest green.

    *   **Pages:** Pale sage green / off-white.

    *   **Text/Ink:** Dark blue/black for typed text; purple/magenta for stamps.

    *   **Photo:** Grayscale (black, white, grey).


    TEXT:

    *   Left Page Top: "Klaus Kerner" (blue text)

    *   Left Page Line 2: "Dusseldorf" (blue text)

    *   Left Page Line 3: "M" (left column), "1.96m" (right column)

    *   Left Page Line 4: "Aug." followed by a date whose digits are not clearly legible

    *   Left Page Line 5: "Germany"

    *   Right Page Bottom: an illegible handwritten signature (blue ink)

    *   Right Page Very Bottom: "A" followed by illegible digits and a final letter (blue text)

    *   Lower Left Corner: Illegible small text block.


    INVARIANTS:

    *   The diagonal orientation of the book relative to the horizontal wood grain.

    *   The specific placement of the three purple stamps relative to the text lines and the photograph.

    *   The position of the photograph in the upper-right quadrant of the right-hand page.

    *   The visibility of the dark green cover only on the far left edge.

    *   No people are painted into the background other than the face inside the photograph prop.
room_009:
  kind: insert
  caption: >-
    SCENE: Close-up insert of an open, two-page newspaper spread. The background is a solid, dark blue field.


    VIEW: High-angle view looking down at the paper, which sits tilted slightly counter-clockwise on the surface.


    LAYOUT:

    *   **Left Page (0 to 0.5 width):** Occupies the left half of the frame. Features a large headline at the top, followed by a halftone photograph of a man in a fedora. Below the photo are three columns of dense body text.

    *   **Right Page (0.5 to 1 width):** Occupies the right half. Features a halftone photograph of a smiling woman at the top. Below this are three columns of body text.

    *   **Center Fold:** A distinct vertical crease runs through the center (x=0.5), with a subtle shadow indicating the page depth.

    *   **Red Markings:** Hand-drawn red ink overlays the print. On the left page, a circle surrounds a word in the sub-headline. On the right page, a curved arrow points upward from a circled exclamation mark in the middle column toward the bottom edge of the woman's photograph.


    OBJECTS:

    *   **Newspaper:** Open flat.

    *   **Photo Left:** Black-and-white portrait of a male figure wearing a wide-brimmed hat and jacket, positioned against a stone wall.

    *   **Photo Right:** Black-and-white portrait of a female figure with shoulder-length hair, smiling, wearing a patterned top.

    *   **Text Columns:** Standard multi-column layout with drop caps visible at the start of some paragraphs.


    LIGHTING: Even, diffuse lighting across the paper surface. No strong directional shadows are cast by the paper itself, though the center fold creates a soft internal shadow.


    PALETTE:

    *   **Background:** Deep indigo/dark blue.

    *   **Paper:** Off-white/light grey.

    *   **Print/Photos:** Monochrome black and grey halftones.

    *   **Markings:** Bright, saturated red.


    TEXT:

    *   Top left header: "Icelandic Antiquities"

    *   Sub-header line: ends "Dark Ages to Light"; the earlier words, including the second word circled in red (possibly "Jones"), are not reliably legible

    *   Body text: Illegible due to resolution; appears as simulated text blocks.


    INVARIANTS:

    *   The specific tilt angle of the newspaper relative to the frame edges.

    *   The placement of the red circle on the left page's sub-header.

    *   The trajectory of the red arrow on the right page, originating from the lower-middle text area and terminating near the woman's chin.

    *   The position of the center fold relative to the text columns (the fold interrupts the central column of both pages).
room_010:
  kind: scene
  caption: >-
    SCENE: Exterior night scene on a city street. The left side shows a lit cinema frontage with a marquee, ticket booth, and sidewalk; the right side is a dark alley or loading dock area against a brick wall, filled with stacked crates.


    VIEW: Wide panoramic view from a low, slightly elevated angle looking down the street at an oblique perspective. The composition is split diagonally, with the bright street receding to the left and the shadowy alley occupying the right two-thirds of the frame.


    LAYOUT:

    - **Left (0.0 - 0.25):** A dark asphalt road with a parked yellow-and-black checkered taxi cab. Adjacent is a brightly lit concrete sidewalk. At the far left edge, a distant city skyline silhouette is visible against a dark blue sky.

    - **Center-Left (0.15 - 0.35):** The cinema entrance features a large red and yellow marquee. Below it is a small glass-fronted ticket booth. To the right of the booth is a "NEWS" stand with a green striped awning. A wooden stand with a black telephone on top sits on the sidewalk in front of the newsstand.

    - **Center (0.4 - 0.6):** A transition zone where the sidewalk ends. A grey concrete wall runs horizontally. Leaning against this wall are several reddish-brown wooden planks and a metal trash can. A single warm spotlight shines down onto a small, illuminated wooden door or hatch set into the ground/wall base.

    - **Right (0.5 - 1.0):** A deep recessed area defined by a dark red brick wall. This space is densely packed with stacks of light brown wooden crates of varying sizes. In the background, a tall ladder leans against the wall, and a hanging lantern provides dim illumination.


    OBJECTS:

    - Taxi cab (parked, yellow with checkered band).

    - Cinema marquee (illuminated).

    - Ticket booth (glass windows).

    - Newsstand (green/white striped awning, red box).

    - Wooden stand (a black telephone sits on top).

    - Metal trash can (lidded).

    - Wooden planks (leaning).

    - Small wooden door/hatch (illuminated by spotlight).

    - Wooden crates (numerous, stacked in piles).

    - Ladder (metal, leaning against back wall).

    - Hanging lantern (top right).


    LIGHTING: High contrast. The left side is dominated by the bright, cool-white/yellow glow of the cinema marquee and streetlights, casting long shadows on the sidewalk. The center has a distinct, warm orange pool of light from a spotlight hitting the small door. The right side is very dark, lit only by a faint, warm glow from the hanging lantern, leaving much of the crate area in deep shadow.


    PALETTE: Deep blues and blacks for the night sky and unlit areas. Bright yellows, oranges, and reds for the cinema lights and spotlight. Muted greys for the concrete and walls. Dark reds/browns for the brickwork. Tan/light brown for the wooden crates and planks.


    TEXT:

    - Marquee: "MADAME SOPHIA TONIGHT" (Top center-left)

    - Newsstand sign: "NEWS" (Center-left, above awning)


    INVARIANTS: No people. The diagonal division between the bright street and dark alley is the primary compositional element. The relative scale of the crates compared to the wall height must be maintained. The specific arrangement of the newsstand, cabinet, and trash can along the sidewalk edge is fixed. The spotlight's position relative to the small door is critical.
room_011:
  kind: scene
  caption: >-
    SCENE: Interior of a grand theater or auditorium, viewed from the audience seating looking up at a proscenium stage. The atmosphere is dark and dramatic, typical of a performance setting.


    VIEW: Eye-level perspective from within the audience. The frame captures the lower portion of the stage, the front edge of the stage floor, and the top of the heads of the seated crowd in the immediate foreground.


    LAYOUT:

    - **Foreground (0.0 - 1.0 width, 0.8 - 1.0 height):** A dense row of silhouetted audience members. They appear as rounded, dark shapes (heads and shoulders) with slight blue/purple highlights on their edges, occupying the bottom 20% of the screen.

    - **Middle Ground (0.0 - 1.0 width, 0.6 - 0.8 height):** The stage floor. It is a wide, horizontal band of warm orange-brown wood. Along its front edge is a decorative railing or balustrade with repeating vertical slats. Above this, on the wooden surface, are several small, dark, semi-circular objects spaced evenly apart, possibly footlights or stage markers.

    - **Background (0.0 - 1.0 width, 0.0 - 0.6 height):** The stage backdrop. On the far left (0.0 - 0.35), there are heavy, draped curtains in deep blue/purple. In the center (0.35 - 0.9), there is a large, rectangular opening framed by a thick, reddish-brown border. Inside this frame is a flat, grey area, likely a screen or an unlit backdrop, with a subtle lighter gradient at the bottom. To the right of the central frame (0.9 - 1.0), more blue/purple drapery is visible. A single, boxy, reddish-brown pedestal or lectern stands on the stage floor to the left of the central frame (approx. 0.3 width).


    OBJECTS:

    - **Curtains:** Heavy fabric drapes on the left and right sides of the stage background.

    - **Proscenium Arch/Frame:** A large, rectangular structural element framing the central grey area.

    - **Screen/Backdrop:** The large, flat grey rectangle within the frame.

    - **Pedestal/Lectern:** A standalone, box-like structure on the stage floor, left of center.

    - **Stage Floor:** Wooden planks with a decorative front rail.

    - **Audience Heads:** Silhouettes of people in the foreground.


    LIGHTING: The scene is dimly lit. The primary light source appears to be ambient, casting soft shadows. The stage floor is illuminated more brightly than the surrounding areas, highlighting the wood grain and the objects on it. The audience in the foreground is largely in shadow, defined by rim lighting. The central grey area is uniformly lit but dull.


    PALETTE:

    - **Dominant:** Deep blues and purples (curtains, audience shadows).

    - **Secondary:** Warm oranges and browns (stage floor, frame, pedestal).

    - **Accent:** Neutral greys (central screen/backdrop).


    TEXT: None.


    INVARIANTS:

    - The relative position of the audience silhouettes in the immediate foreground.

    - The horizontal alignment of the stage floor and its decorative rail.

    - The placement of the central rectangular frame and the grey area within it.

    - The position of the pedestal to the left of the central frame.

    - The drape pattern of the curtains on the far left and right.

    - The spacing of the small dark objects along the front edge of the stage.
room_012:
  kind: scene
  caption: >-
    SCENE: Backstage wing of a theatre: blue curtains, stage lights and ropes, a wooden stage floor edged with coloured footlights, and a seated audience visible beyond the stage at upper left.


    VIEW: A slightly elevated side-angle view looking into the room. The perspective follows the diagonal lines of the wooden floorboards leading toward the back right.


    LAYOUT:

    - **Left Foreground (0.0–0.25):** Stage spotlights on tall stands, pulleys and hanging ropes occupy the bottom left corner.

    - **Left Middle (0.25–0.40):** A wooden console box sits on the floor. It has a black upper face with three circular dials and a sloped lower panel with three white levers and a small red knob, above an open shelf holding dark equipment.

