    - **Center (0.35–0.65):** A massive, dark square foreground pillar, braced by two diagonal beams at the top, stands vertically, splitting the view. To its right is a square fire pit set into the floor, filled with burning orange flames and logs. A small metal bucket sits near the base of the tree.

    - **Right (0.65–1.0):** The floor transitions to greenish stone tiles. There are rectangular recessed areas or shallow pits. On the far right wall is a dark, arched doorway leading deeper into the darkness. Two buckets sit near this entrance.


    OBJECTS:

    - **Skeletons:** Multiple complete and partial skeletons on the left slab and scattered on the floor.

    - **Pillar:** A thick, dark square vertical column dominating the center-left.

    - **Fire Pit:** A square depression in the floor with active fire.

    - **Buckets:** Three visible metal or stone buckets (one near the tree, two near the right door).

    - **Doorway:** A single open, dark arched entrance on the right wall.

    - **Stone Slabs:** Rectangular blocks forming the floor and the platform for the skeletons.


    LIGHTING: The primary light source is the fire pit, casting a warm orange glow onto the surrounding floor and the base of the central pillar. Secondary lighting appears to come from the upper right, illuminating the right-hand wall and the doorway area with a cool, pale greenish-white light. The left side of the room is significantly darker and in shadow.


    PALETTE: Dominated by muted earth tones—greys, browns, and dull greens for the stone and walls. The fire provides a stark contrast with bright oranges and yellows. The skeletons are bone-white/grey. The pillar is nearly black.


