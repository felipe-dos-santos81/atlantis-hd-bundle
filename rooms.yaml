  caption: >-
    SCENE: Interior of a stone crypt or dungeon. The architecture is rough-hewn brick with decorative carved pillars and arches. The atmosphere is dark, ancient, and slightly ominous, characterized by scattered bones and a glowing fire pit.


    VIEW: A wide-angle, eye-level perspective looking into the room. The room is one continuous wide scrolling panorama.


    LAYOUT:

