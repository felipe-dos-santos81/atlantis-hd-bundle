room_001:
  kind: scene
  caption: >-
    SCENE: Interior of a cluttered, dilapidated workshop or storage room. The atmosphere is dusty and abandoned, with peeling green wallpaper and exposed wooden ceiling beams.


    VIEW: Eye-level side profile view. Standard 2D adventure game perspective looking straight across the room from left to right.


    LAYOUT:

    Left (0-0.3): A tall, dark wooden shelving unit filled with miscellaneous objects sits against the wall. Next to it are two tall, arched windows with bright light streaming in. Below the windows is a workbench with small jars and tools.

    Center (0.3-0.6): A black cast-iron pot-bellied stove stands near the window line, its flue pipe rising to the ceiling ductwork. To its right is a closed wooden door with a glass panel. At the center a desk holds a small dark statuette.

    Right (0.6-1.0): Two lighter-colored wooden shelving units stand side-by-side. The left one has a ladder leaning against its front face. The shelves contain boxes and various items. Further right is another cabinet structure and a broom leaning against the far wall.

    Foreground (Bottom 0.7-1.0): A deep-shadow foreground: the dark silhouettes of a desk, a chair, and a large round wooden tub.


    OBJECTS:

    *   Shelving units: Three main structures (one dark left, two light right).

    *   Windows: Two arched windows, open or clear, showing green foliage outside.

    *   Door: One central wooden door, closed.

    *   Furniture: Workbench under windows, crates in foreground.

    *   Props: Pot-bellied stove with flue pipe, statuette on the desk, ladder, hanging lamps, a white enamel appliance on the right-hand table, round tub in the foreground.


    LIGHTING:

    Primary light sources are the three hanging pendant lamps (conical shades) casting warm yellow pools of light downwards. Secondary light comes from the windows on the left, which are very bright (blown out white/green). The foreground bottom area is in deep shadow. Shadows fall directly beneath objects and hangings.


    PALETTE:

    *   Walls: Muted sage green, heavily textured/peeling.

    *   Woodwork: Ranges from dark brown (left shelf, floor) to medium tan (right shelves, door).

    *   Ceiling: Dark brown beams, grey ductwork.

    *   Accents: Bright white/green (windows), black iron (stove), metallic grey (lamps), rust orange/brown (debris).


    TEXT: none


    INVARIANTS:

    *   The vertical alignment of the windows relative to the left shelf.

    *   The position of the stove between the windows and the door.

    *   The ladder leaning specifically against the middle-right shelf unit.

    *   The horizontal division between the lit floor and the dark foreground silhouettes.

    *   The specific placement of the three hanging lamps across the upper third of the image.

    *   No people.
