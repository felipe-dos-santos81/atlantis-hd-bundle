room_058:
  kind: scene
  caption: >-
    SCENE: Exterior archaeological dig site in a dry, hilly landscape. Ruins of low stone structures and scattered standing stones occupy the midground against eroded hills and blue sky.


    VIEW: Wide panoramic view from a slightly elevated, eye-level perspective looking across the site toward the horizon.


    LAYOUT:

    - 0.0–0.1 (mid-ground): Low stone wall with a wooden fence running parallel to it; small ruined hut behind the wall.

    - 0.15–0.25 (foreground/mid-ground): A large, rough-hewn stone pillar or broken column base; a tall, curved standing stone slab leans nearby.

    - 0.3–0.4 (mid-ground): A small rectangular stone building with a dark doorway; another tall, flat standing stone slab stands vertically in front of it.

    - 0.45–0.6 (mid-ground): A second similar stone building; a third standing stone slab is visible further back. Two short dark-red Minoan columns stand on a low platform beside it.

    - 0.65–0.75 (foreground/mid-ground): A square stone platform or altar with a central post; a tall, thin rectangular pillar stands to its right.

    - 0.8–1.0 (mid-ground): More low stone walls and ruins; a final small building on the far right.

    Background consists of rolling brown hills with sparse green vegetation (cypress-like trees) under a blue sky with white clouds.


    OBJECTS: Multiple ruined stone buildings with open doorways (no doors). Several large standing stones (menhirs) of varying shapes (curved, flat, pillar-like). Wooden fences along some walls. Stone platforms/altars. No windows are clearly visible.


    LIGHTING: Bright daylight from above and slightly to the left, casting soft shadows to the right of objects. High exposure in the sky and sunlit ground; darker tones in shadowed areas under structures and within doorways.


    PALETTE: Dominant earth tones—sandy beige ground, light grey/tan stone, reddish-brown hills. Sky is bright blue with white clouds. Sparse green accents from trees and bushes. Dark brown/black for doorways and deep shadows.


    TEXT: None.


    INVARIANTS: The relative positions of the standing stones, ruined buildings, and hills must remain consistent. The two dark-red columns sit at approximately 0.45 horizontal position. No people. The curved shape of the leftmost standing stone and the flat profile of the central ones are key compositional elements. The horizon line remains level across the panorama.
